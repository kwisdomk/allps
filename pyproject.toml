[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allps"
version = "0.1.0"
description = "Agentic Longitudinal Learner Profile System — preserving learning continuity across terms, years, and teachers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "aiosqlite>=0.19",
    "mcp>=1.0",
    "pydantic-ai>=2.56.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
allps-mcp = "allps.mcp.server:main"
allps-mcp-import = "allps.agent.mcp_agent:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/allps"]
